sync_to_monitor yes
scrollback_lines 1000000
enable_audio_bell no
cursor_trail 1
font_family JetBrains Mono Nerd Font
font_size 12.0
confirm_os_window_close 0
hide_window_decorations yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# Shift+Enter is plain \r in legacy mode; give it the CSI-u form zsh binds.
# Apps that turn on kitty's keyboard protocol already get that, so not "kitty".
map shift+enter send_text normal,application \x1b[13;2u
paste_actions no-op

include current-theme.conf
# theme-set's render of the live palette (Mocha or the wallpaper's); overrides
# the line above, which only stands in until theme-set has run once.
include ~/.local/state/theme/kitty.conf
